			/* Ocult visualment pero accessible (screen-reader only / sr-only) */
			.oaw-utility-nav {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}
			.oaw-utility-nav a { color: #F6F6F6; }
			.oaw-utility-nav a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
		</style>
	</head>
