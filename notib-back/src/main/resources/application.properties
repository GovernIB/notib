server.servlet.context-path=/notibback
server.error.path=/error
server.forward-headers-strategy=framework

spring.jpa.properties.hibernate.dialect=es.caib.notib.persist.dialect.OracleCaibDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Carrega les associacions lazy (p.ex. documents, òrgan i procediment de les files d'un llistat) en
# blocs amb "where id in (...)" en lloc d'una consulta per element (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Files per anada i tornada a la base de dades en llegir el resultat d'una consulta. El driver d'Oracle en
# llegeix 10 per defecte: una pàgina de 250 remeses eren 25 viatges (segons, si la xarxa té latència)
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.hibernate.naming-strategy=es.caib.notib.persist.audit.CustomPhysicalNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.open-in-view=false

spring.mvc.view.prefix=/WEB_INF/jsp/
spring.mvc.view.suffix=.jsp
spring.freemarker.enabled=false
spring.messages.basename=messages
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.jackson.default-property-inclusion=non_null

spring.liquibase.enabled=false
spring.liquibase.database-change-log-table=NOT_DATABASECHANGELOG
spring.liquibase.database-change-log-lock-table=NOT_DATABASECHANGELOGLOCK
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.labels=none

spring.cache.jcache.config=classpath:ehcache.xml

spring.jmx.enabled=true

spring.management.endpoints.jmx.exposure.include="*"

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.jersey.JerseyServerMetricsAutoConfiguration
