                                indexName: ${db_prefix}TABLE_ENT_CREATED_I
            changes:
                -   createIndex:
                        tableName: ${db_prefix}NOTIFICACIO_TABLE
                        indexName: ${db_prefix}TABLE_ENT_CREATED_I
                        columns:
                            -   column:
                                    name: ENTITAT_ID
                            -   column:
                                    name: DELETED
                            -   column:
                                    name: CREATEDDATE
                            -   column:
                                    name: ORGAN_ID
                            -   column:
                                    name: PROCEDIMENT_ID
                            -   column:
                                    name: PROCEDIMENT_ORGAN_ID
                            -   column:
                                    name: CREATEDBY_CODI
                            -   column:
                                    name: ID

