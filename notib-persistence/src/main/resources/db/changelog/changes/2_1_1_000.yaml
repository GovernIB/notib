databaseChangeLog:
  - changeSet:
      id: 2_1_1_000-1
      author: limit
      changes:
        - dropPrimaryKey:
            tableName: ${db_prefix}config
            constraintName: ${db_prefix}CONFIG_PK
        - addColumn:
            tableName: ${db_prefix}config
            columns:
              - column:
                  name: id
                  type: bigint
        - sql:
            sql: "UPDATE ${db_prefix}CONFIG SET id = ${db_prefix}HIBERNATE_SEQ.nextval"
        - addPrimaryKey:
            tableName: ${db_prefix}config
            columnNames: id
            constraintName: ${db_prefix}CONFIG_PK
        - addUniqueConstraint:
            columnNames: key
            constraintName: ${db_prefix}CONFIG_KEY_UK
            tableName: ${db_prefix}config
        - dropForeignKeyConstraint:
            baseTableName: ${db_prefix}config
            constraintName: ${db_prefix}CONFIG_GROUP_FK

  - changeSet:
      id: 2_1_1_000-2
      author: limit
      changes:
        - dropPrimaryKey:
            tableName: ${db_prefix}config_group
            constraintName: ${db_prefix}CONFIG_GROUP_PK
        - addColumn:
            tableName: ${db_prefix}config_group
            columns:
              - column:
                  name: id
                  type: bigint
        - sql:
            sql: "UPDATE ${db_prefix}CONFIG_GROUP SET id = ${db_prefix}HIBERNATE_SEQ.nextval"
        - addPrimaryKey:
            tableName: ${db_prefix}config_group
            columnNames: id
            constraintName: ${db_prefix}CONFIG_GROUP_PK
        - addUniqueConstraint:
            columnNames: code
            constraintName: ${db_prefix}CONFIG_GROUP_CODE_UK
            tableName: ${db_prefix}config_group

  - changeSet:
      id: 2_1_1_000-3
      author: limit
      changes:
        - dropPrimaryKey:
            tableName: ${db_prefix}config_type
            constraintName: ${db_prefix}CONFIG_TYPE_PK
        - addColumn:
            tableName: ${db_prefix}config_type
            columns:
              - column:
                  name: id
                  type: bigint
        - sql:
            sql: "UPDATE ${db_prefix}CONFIG_TYPE SET id = ${db_prefix}HIBERNATE_SEQ.nextval"
        - addPrimaryKey:
            tableName: ${db_prefix}config_type
            columnNames: id
            constraintName: ${db_prefix}CONFIG_TYPE_PK
        - addUniqueConstraint:
            columnNames: code
            constraintName: ${db_prefix}CONFIG_TYPE_CODE_UK
            tableName: ${db_prefix}config_type
        - addForeignKeyConstraint:
            baseTableName: ${db_prefix}CONFIG
            baseColumnNames: GROUP_CODE
            referencedTableName: ${db_prefix}CONFIG_GROUP
            referencedColumnNames: CODE
            constraintName: ${db_prefix}CONFIG_GROUP_FK
