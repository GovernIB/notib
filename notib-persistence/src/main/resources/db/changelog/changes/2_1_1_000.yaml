databaseChangeLog:
    -   property:
            name: booleanFalse
            value: 0
            dbms: oracle
    -   property:
            name: booleanFalse
            value: false
            dbms: postgresql
    -   property:
            dbms: oracle
            name: type.pk
            value: number(19,0)
    -   property:
            dbms: postgresql
            name: type.pk
            value: SERIAL
    -   property:
            name: varcharUnit
            value: CHAR
            dbms: oracle
    -   property:
            name: varcharUnit
            value: ''
            dbms: postgresql
    # Índexs per ordenar columnes de text. A Oracle, la sessió ordena amb l'NLS_SORT de la JVM (CATALAN amb
    # una JVM ca_ES) i un ORDER BY de text només pot fer servir un índex NLSSORT amb el mateix NLS_SORT.
    # A PostgreSQL l'índex normal ja segueix la collation de la base de dades.
    -   property:
            name: ordreTextInici
            value: "NLSSORT("
            dbms: oracle
    -   property:
            name: ordreTextFi
            value: ",'NLS_SORT=CATALAN')"
            dbms: oracle
    -   property:
            name: ordreTextInici
            value: ''
            dbms: postgresql
    -   property:
            name: ordreTextFi
            value: ''
            dbms: postgresql
