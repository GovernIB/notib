                -   not:
                        -   indexExists:
                                tableName: ${db_prefix}NOTIFICACIO_ENV
                                columnNames: NOTIFICACIO_ID
            changes:
                # Enviaments d'una remesa (càlcul de la columna estat, detall, llistat d'enviaments)
                -   createIndex:
                        tableName: ${db_prefix}NOTIFICACIO_ENV
                        indexName: ${db_prefix}NOTIFICACIO_NOTDEST_FK_I
                        columns:
                            -   column:
                                    name: NOTIFICACIO_ID

    # Índex de clau forana que ja creaven els scripts SQL històrics però no el changelog inicial:
