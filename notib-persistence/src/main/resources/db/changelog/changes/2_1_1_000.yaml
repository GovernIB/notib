    # Índex de clau forana que ja creaven els scripts SQL històrics però no el changelog inicial:
    # sense ell, amb volum, cada consulta recorre tota la taula. Es comprova per columnes perquè
    # l'entorn pot tenir l'índex equivalent amb un altre nom.
    -   changeSet:
            id: 2_1_1_000-30
            author: limit
            preConditions:
