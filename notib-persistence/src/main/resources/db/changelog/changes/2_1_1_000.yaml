    # Procés inicial: crea el registre de not_notificacio_table de les remeses que no en tenen (no sortien al
    # llistat JSP i farien inexacte el total del llistat de React, que es compta sense JOIN a la taula)
    -   changeSet:
            id: 2_1_1_000-42
            author: limit
            preConditions:
                -   onFail: MARK_RAN
                -   sqlCheck:
                        expectedResult: 0
                        sql: SELECT COUNT(*) FROM ${db_prefix}PROCESSOS_INICIALS WHERE CODI = 'CREAR_REGISTRES_NOT_NOTIFICACIO_TABLE'
            changes:
                -   insert:
                        tableName: ${db_prefix}PROCESSOS_INICIALS
                        columns:
                            -   column:
                                    name: ID
                                    valueNumeric: 7
                            -   column:
                                    name: CODI
                                    value: CREAR_REGISTRES_NOT_NOTIFICACIO_TABLE
                            -   column:
                                    name: INIT
                                    valueBoolean: true

    # Llistat de remeses (interfície React): es filtra, s'ordena, es pagina i es compta només amb
    # not_notificacio_table, com al llistat JSP. El permís per procediment necessita el procediment de la remesa.
    -   changeSet:
            id: 2_1_1_000-44
            author: limit
            preConditions:
                -   onFail: MARK_RAN
                -   not:
                        -   columnExists:
                                tableName: ${db_prefix}NOTIFICACIO_TABLE
                                columnName: PROCEDIMENT_ID
            changes:
                -   addColumn:
                        tableName: ${db_prefix}NOTIFICACIO_TABLE
                        columns:
                            -   column:
                                    name: PROCEDIMENT_ID
                                    type: ${type.pk}
                -   sql: "UPDATE ${db_prefix}NOTIFICACIO_TABLE t SET PROCEDIMENT_ID = (SELECT n.PROCEDIMENT_ID FROM ${db_prefix}NOTIFICACIO n WHERE n.ID = t.ID)"

    # Ordenació del llistat de remeses: amb l'índex, la base de dades llegeix les files ja ordenades i s'atura
    # a la mida de pàgina. Els de text, a Oracle, són NLSSORT (vegeu les propietats ordreTextInici/ordreTextFi).
    # Darrere la columna de l'ordenació hi ha les dels filtres de permisos i de "només les meves", i l'ID: la
    # consulta dels ids d'una pàgina es resol llegint només l'índex, sense accedir a la taula per cada fila
    # anterior a la pàgina (les pàgines del mig d'un milió de remeses, de ~2 s a ~0,4 s).
    -   changeSet:
            id: 2_1_1_000-45
            author: limit
            preConditions:
                -   onFail: MARK_RAN
                -   not:
                        -   indexExists:
