databaseChangeLog:
    -   property:
            name: booleanFalse
            value: 0
            dbms: oracle
    -   property:
            name: booleanFalse
            value: false
            dbms: postgresql
    -   property:
            dbms: oracle
            name: type.pk
            value: number(19,0)
    -   property:
            dbms: postgresql
            name: type.pk
            value: SERIAL
    -   property:
            name: varcharUnit
            value: CHAR
            dbms: oracle
    -   property:
            name: varcharUnit
            value: ''
            dbms: postgresql
    -   changeSet:
            id: 2_1_1_000-1
            author: limit
            changes:
                -   dropPrimaryKey:
                        tableName: ${db_prefix}config
                        constraintName: ${db_prefix}CONFIG_PK
                -   addColumn:
                        tableName: ${db_prefix}config
                        columns:
                            -   column:
                                    name: id
                                    type: bigint
                -   update:
                        tableName: ${db_prefix}CONFIG
                        columns:
                            -   column:
                                    name: id
                                    valueNumeric: ${hibernateSeqNextVal}
                -   addPrimaryKey:
                        tableName: ${db_prefix}config
                        columnNames: id
                        constraintName: ${db_prefix}CONFIG_PK
                -   addUniqueConstraint:
                        columnNames: key
                        constraintName: ${db_prefix}CONFIG_KEY_UK
                        tableName: ${db_prefix}config
                -   dropForeignKeyConstraint:
                        baseTableName: ${db_prefix}config
                        constraintName: ${db_prefix}CONFIG_GROUP_FK

    -   changeSet:
            id: 2_1_1_000-2
            author: limit
            changes:
                -   dropPrimaryKey:
                        tableName: ${db_prefix}config_group
                        constraintName: ${db_prefix}CONFIG_GROUP_PK
                -   addColumn:
                        tableName: ${db_prefix}config_group
                        columns:
                            -   column:
                                    name: id
                                    type: bigint
                -   update:
                        tableName: ${db_prefix}CONFIG_GROUP
                        columns:
                            -   column:
                                    name: id
                                    valueNumeric: ${hibernateSeqNextVal}
                -   addPrimaryKey:
                        tableName: ${db_prefix}config_group
                        columnNames: id
                        constraintName: ${db_prefix}CONFIG_GROUP_PK
                -   addUniqueConstraint:
                        columnNames: code
                        constraintName: ${db_prefix}CONFIG_GROUP_CODE_UK
                        tableName: ${db_prefix}config_group

    -   changeSet:
            id: 2_1_1_000-3
            author: limit
            changes:
                -   dropPrimaryKey:
                        tableName: ${db_prefix}config_type
                        constraintName: ${db_prefix}CONFIG_TYPE_PK
                -   addColumn:
                        tableName: ${db_prefix}config_type
                        columns:
                            -   column:
                                    name: id
                                    type: bigint
                -   update:
                        tableName: ${db_prefix}CONFIG_TYPE
                        columns:
                            -   column:
                                    name: id
                                    valueNumeric: ${hibernateSeqNextVal}
                -   addPrimaryKey:
                        tableName: ${db_prefix}config_type
                        columnNames: id
                        constraintName: ${db_prefix}CONFIG_TYPE_PK
                -   addUniqueConstraint:
                        columnNames: code
                        constraintName: ${db_prefix}CONFIG_TYPE_CODE_UK
                        tableName: ${db_prefix}config_type
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}CONFIG
                        baseColumnNames: GROUP_CODE
                        referencedTableName: ${db_prefix}CONFIG_GROUP
                        referencedColumnNames: CODE
                        constraintName: ${db_prefix}CONFIG_GROUP_FK

    -   changeSet:
            id: 2_1_1_000-4
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}CONFIG
                        columns:
                            -   column:
                                    name: config_group_id
                                    type: bigint
                            -   column:
                                    name: config_type_id
                                    type: bigint
                            -   column:
                                    name: entitat_id
                                    type: bigint
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}CONFIG
                        baseColumnNames: config_group_id
                        referencedTableName: ${db_prefix}CONFIG_GROUP
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}CONFIG_GROUP_ID_FK
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}CONFIG
                        baseColumnNames: config_type_id
                        referencedTableName: ${db_prefix}CONFIG_TYPE
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}CONFIG_TYPE_ID_FK
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}CONFIG
                        baseColumnNames: entitat_id
                        referencedTableName: ${db_prefix}ENTITAT
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}CONFIG_ENTITAT_FK
                -   sql:
                        sql: " UPDATE ${db_prefix}config a SET config_group_id = (SELECT b.id FROM ${db_prefix}config_group b WHERE a.GROUP_CODE = b.code) WHERE a.GROUP_CODE IS NOT NULL;
            UPDATE ${db_prefix}config a SET config_type_id = (SELECT b.id FROM ${db_prefix}config_type b WHERE a.TYPE_CODE = b.code) WHERE a.TYPE_CODE IS NOT NULL;
            UPDATE ${db_prefix}config a SET entitat_id = (SELECT b.id FROM ${db_prefix}entitat b WHERE a.ENTITAT_CODI = b.CODI) WHERE a.ENTITAT_CODI IS NOT NULL; "
                -   addNotNullConstraint:
                        tableName: ${db_prefix}CONFIG
                        columnName: config_group_id
                -   addNotNullConstraint:
                        tableName: ${db_prefix}CONFIG
                        columnName: config_type_id
    -   changeSet:
            id: 2_1_1_000-5
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}CONFIG_GROUP
                        columns:
                            -   column:
                                    name: parent_id
                                    type: bigint
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}CONFIG_GROUP
                        baseColumnNames: parent_id
                        referencedTableName: ${db_prefix}CONFIG_GROUP
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}CONFIG_GROUP_PARENT_FK
                -   sql:
                        sql: "UPDATE ${db_prefix}config_group a SET parent_id = (SELECT b.id FROM ${db_prefix}config_group b WHERE a.PARENT_CODE  = b.code) WHERE a.parent_code IS NOT NULL; "
    -   changeSet:
            id: 2_1_1_000-6
            author: limit
            changes:
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}NOTIFICACIO_ENV_TABLE
                        baseColumnNames: organ_id
                        referencedTableName: ${db_prefix}ORGAN_GESTOR
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}ENV_TABLE_ORGAN_FK
    -   changeSet:
            id: 2_1_1_000-7
            author: limit
            changes:
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}NOTIFICACIO_TABLE
                        baseColumnNames: organ_id
                        referencedTableName: ${db_prefix}ORGAN_GESTOR
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}NOT_TABLE_ORGAN_FK
    -   changeSet:
            id: 2_1_1_000-8
            author: limit
            changes:
                -   addPrimaryKey:
                        tableName: ${db_prefix}NOTIFICACIO_ENV_TABLE
                        columnNames: id
    -   changeSet:
            id: 2_1_1_000-9
            author: limit
            changes:
                -   addNotNullConstraint:
                        tableName: ${db_prefix}PAGADOR_POSTAL
                        columnName: contracte_num
                -   addNotNullConstraint:
                        tableName: ${db_prefix}PAGADOR_POSTAL
                        columnName: facturacio_codi_client

    -   changeSet:
            id: 2_1_1_000-10
            author: limit
            changes:
                -   modifyDataType:
                        tableName: NOT_NOTIFICACIO_ENV
                        columnName: NOTIFICA_DATAT_RECNIF
                        newDataType: varchar(50 ${varcharUnit})

    -   changeSet:
            id: 2_1_1_000-11
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}ORGAN_GESTOR
                        columns:
                            -   column:
                                    name: organ_pare
                                    type: bigint
                - sql: "UPDATE ${db_prefix}organ_gestor a SET organ_pare = (select b.id from ${db_prefix}organ_gestor b where b.entitat = a.entitat and b.codi = a.codi_pare);"

    -   changeSet:
            id: 2_1_1_000-12
            author: limit
            changes:
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}ORGAN_GESTOR
                        baseColumnNames: organ_pare
                        referencedTableName: ${db_prefix}ORGAN_GESTOR
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}ORGAN_PARE_FK

    -   changeSet:
            id: 2_1_1_000-13
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}USUARI
                        columns:
                            -   column:
                                    name: tema
                                    type: varchar(10 ${varcharUnit})

    -   changeSet:
            id: 2_1_1_000-14
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}NOTIFICACIO_ENV_TABLE
                        columns:
                            -   column:
                                    name: procediment_id
                                    type: bigint
                -   sql:
                        "UPDATE NOT_NOTIFICACIO_ENV_TABLE t SET t.PROCEDIMENT_ID = (SELECT ID FROM NOT_PROCEDIMENT p WHERE p.codi = t.PROCEDIMENT_CODI_NOTIB);"
    -   changeSet:
            id: 2_1_1_000-15
            author: limit
            changes:
                -   addColumn:
                        tableName: not_usuari
                        columns:
                            -   column:
                                    name: rebre_emails_agrupats
                                    type: boolean
                                    defaultValue: ${booleanFalse}
                -   createTable:
                        tableName: NOT_CORREUS_AGRUPATS
                        columns:
                            -   column:
                                    name: id
                                    type: ${type.pk}
                                    constraints:
                                        nullable: false
                                        primaryKey: true
                                        primaryKeyName: NOT_CORREUS_AGRUPATS_PK
                            -   column:
                                    name: enviament_id
                                    type: BIGINT
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: createdby_codi
                                    type: varchar(64 ${varcharUnit})
                            -   column:
                                    name: LASTMODIFIEDBY_CODI
                                    type: varchar(64 ${varcharUnit})
                            -   column:
                                    name: LASTMODIFIEDDATE
                                    type: TIMESTAMP(6)
                            -   column:
                                    name: createddate
                                    type: TIMESTAMP(6)
                -   addForeignKeyConstraint:
                        baseTableName: NOT_CORREUS_AGRUPATS
                        baseColumnNames: enviament_id
                        referencedTableName: NOT_NOTIFICACIO_ENV
                        referencedColumnNames: id
                        constraintName: CORREUS_AGRUPATS_ENV_ID_FK
                -   sql: "INSERT INTO NOT_CONFIG (ID, KEY, VALUE, DESCRIPTION, GROUP_CODE, POSITION, JBOSS_PROPERTY, TYPE_CODE, CONFIGURABLE, CONFIG_GROUP_ID, CONFIG_TYPE_ID)
                            VALUES (HIBERNATE_SEQUENCE.NEXTVAL, 'es.caib.notib.enviar.correus.agrupats.cron', '0 0 21 * * *', 'Especificar l''expressió cron indicant la freqüencia en que s''han d''enviar les correus aguprats per dia', 'EMAIL', 1, 0, 'CRON', 0,
                            (SELECT ID FROM NOT_CONFIG_GROUP g WHERE g.code = 'EMAIL'), (SELECT ID FROM NOT_CONFIG_TYPE t WHERE t.code = 'CRON') );"

    -   changeSet:
            id: 2_1_1_000-16
            author: limit
            changes:
                -   modifyDataType:
                        tableName: NOT_PERSONA
                        columnName: RAO_SOCIAL
                        newDataType: varchar(255 ${varcharUnit})

    -   changeSet:
            id: 2_1_1_000-17
            author: limit
            changes:
                -   update:
                        tableName: ${db_prefix}notificacio_env_table
                        columns:
                            -   column:
                                    name: registre_numero
                                    value: null
                -   modifyDataType:
                        tableName: ${db_prefix}notificacio_env_table
                        columnName: registre_numero
                        newDataType: varchar(50 ${varcharUnit})
                -   sql: "UPDATE not_notificacio_env_table t SET registre_numero = (SELECT registre_numero_formatat FROM NOT_NOTIFICACIO_ENV e WHERE t.id = e.id);"

    -   changeSet:
            id: 2_1_1_000-18
            author: limit
            changes:
                -   addColumn:
                        tableName: ${db_prefix}notificacio
                        columns:
                            -   column:
                                    name: grup_id
                                    type: bigint
                -   sql: "UPDATE not_notificacio n SET grup_id = (SELECT id FROM not_grup g WHERE n.GRUP_CODI = g.CODI) WHERE n.GRUP_CODI IS NOT NULL;"

    -   changeSet:
            id: 2_1_1_000-19
            author: limit
            changes:
                -   addForeignKeyConstraint:
                        baseTableName: ${db_prefix}ACCIO_MASSIVA
                        baseColumnNames: entitat_id
                        referencedTableName: ${db_prefix}ENTITAT
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}ACCIO_MASSIVA_ENTITAT_FK
    -   changeSet:
            id: 2_1_1_000-20
            author: limit
            changes:
                - addColumn:
                      tableName: not_accio_massiva
                      columns:
                          - column:
                                name: tipus_seleccionat
                                type: varchar(20 ${varcharUnit})
                          - column:
                                name: motiu
                                type: varchar(250 ${varcharUnit})
                          - column:
                                name: admin_entitat
                                type: boolean
                                defaultValue: 0
                          - column:
                                name: dies
                                type: Integer
    -   changeSet:
            id: 2_1_1_000-21
            author: limit
            changes:
                -   sql: "INSERT INTO NOT_CONFIG (id,POSITION, KEY, VALUE, JBOSS_PROPERTY, DESCRIPTION, GROUP_CODE, TYPE_CODE, CONFIG_GROUP_ID, CONFIG_TYPE_ID)
                            VALUES (HIBERNATE_SEQUENCE.NEXTVAL, 1, 'es.caib.notib.plugin.cie.https', 'true', 0, 'El WS del plugin CIE es via https', 'CIE', 'BOOL',
                            (SELECT ID FROM NOT_CONFIG_GROUP g WHERE g.code = 'CIE'), (SELECT ID FROM NOT_CONFIG_TYPE t WHERE t.code = 'BOOL') );"
