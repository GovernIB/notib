                        baseColumnNames: config_group_id
                        referencedTableName: ${db_prefix}CONFIG_GROUP
                        referencedColumnNames: ID
                        constraintName: ${db_prefix}CONFIG_GROUP_ID_FK
                -   addForeignKeyConstraint:
