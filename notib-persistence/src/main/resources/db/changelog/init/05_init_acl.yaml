databaseChangeLog:
  - changeSet:
      id: init_acl-1
      author: limit
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: ${db_prefix}acl_object_identity_pk
                  autoIncrement: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: object_id_class
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: object_id_identity
                  type: VARCHAR(255 ${varcharUnit})
              - column:
                  name: parent_object
                  type: BIGINT
              - column:
                  name: owner_sid
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: entries_inheriting
                  type: BOOLEAN
            tableName: ${db_prefix}acl_object_identity
  - changeSet:
      id: init_acl-2
      author: limit
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: ${db_prefix}acl_sid_pk
                  autoIncrement: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: principal
                  type: BOOLEAN
              - column:
                  constraints:
                    nullable: false
                  name: sid
                  type: VARCHAR(100 ${varcharUnit})
            tableName: ${db_prefix}acl_sid
  - changeSet:
      id: init_acl-3
      author: limit
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: ${db_prefix}acl_entry_pk
                  autoIncrement: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: acl_object_identity
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: ace_order
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: sid
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: mask
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: granting
                  type: BOOLEAN
              - column:
                  constraints:
                    nullable: false
                  name: audit_success
                  type: BOOLEAN
              - column:
                  constraints:
                    nullable: false
                  name: audit_failure
                  type: BOOLEAN
            tableName: ${db_prefix}acl_entry
  - changeSet:
      id: init_acl-4
      author: limit
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: ${db_prefix}acl_class_pk
                  autoIncrement: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: class
                  type: VARCHAR(100 ${varcharUnit})
              - column:
                  constraints:
                    nullable: false
                  name: class_id_type
                  type: VARCHAR(255 ${varcharUnit})
            tableName: ${db_prefix}acl_class
  - changeSet:
      id: init_acl-5
      author: limit
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: parent_object
            baseTableName: ${db_prefix}acl_object_identity
            constraintName: ${db_prefix}acloid_acloid_fk_1
            referencedColumnNames: id
            referencedTableName: ${db_prefix}acl_object_identity
            validate: true
  - changeSet:
      id: init_acl-6
      author: limit
      changes:
        - addForeignKeyConstraint:
            constraintName: ${db_prefix}aclentry_acloid_fk
            baseTableName: ${db_prefix}acl_entry
            baseColumnNames: acl_object_identity
            referencedTableName: ${db_prefix}acl_object_identity
            referencedColumnNames: id
            validate: true
  - changeSet:
      id: init_acl-7
      author: limit
      changes:
        - addForeignKeyConstraint:
            constraintName: ${db_prefix}aclentry_aclsid_fk
            baseTableName: ${db_prefix}acl_entry
            baseColumnNames: sid
            referencedTableName: ${db_prefix}acl_sid
            referencedColumnNames: id
            validate: true
  - changeSet:
      id: init_acl-8
      author: limit
      changes:
        - addForeignKeyConstraint:
            constraintName: ${db_prefix}acloid_aclclass_fk_2
            baseTableName: ${db_prefix}acl_object_identity
            baseColumnNames: object_id_class
            referencedTableName: ${db_prefix}acl_class
            referencedColumnNames: id
            validate: true
  - changeSet:
      id: init_acl-9
      author: limit
      changes:
        - addForeignKeyConstraint:
            constraintName: ${db_prefix}acloid_aclsid_fk_3
            baseTableName: ${db_prefix}acl_object_identity
            baseColumnNames: owner_sid
            referencedTableName: ${db_prefix}acl_sid
            referencedColumnNames: id
            validate: true
  - changeSet:
      id: init_acl-10
      author: limit
      changes:
        - addUniqueConstraint:
            constraintName: ${db_prefix}acloid_uk
            tableName: ${db_prefix}acl_object_identity
            columnNames: object_id_class, object_id_identity
  - changeSet:
      id: init_acl-11
      author: limit
      changes:
        - addUniqueConstraint:
            constraintName: ${db_prefix}aclsid_uk
            tableName: ${db_prefix}acl_sid
            columnNames: sid, principal
  - changeSet:
      id: init_acl-12
      author: limit
      changes:
        - addUniqueConstraint:
            constraintName: ${db_prefix}aclentry_uk
            tableName: ${db_prefix}acl_entry
            columnNames: acl_object_identity, ace_order
  - changeSet:
      id: init_acl-13
      author: limit
      changes:
        - addUniqueConstraint:
            constraintName: ${db_prefix}aclclass_uk
            tableName: ${db_prefix}acl_class
            columnNames: class
  - changeSet:
      id: init_acl-14
      author: limit
      changes:
        - sqlFile:
            dbms: oracle
            splitStatements: true
            endDelimiter: /
            path: ../scripts/init/oracle_acl_triggers.sql
            relativeToChangelogFile: true